name: Run YouTube Shorts Bot

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Tools & Voice Model
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          sudo sed -i 's/policy domain="path" rights="none" pattern="@\*"/policy domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "Pillow<10.0.0" google-api-python-client google-auth-oauthlib google-auth-httplib2 google-generativeai "moviepy<2.0.0" requests piper-tts

      - name: Inject Secrets & Run Bot
        env:
          CLIENT_SECRETS_DATA: ${{ secrets.CLIENT_SECRETS }}
          TOKEN_JSON_DATA: ${{ secrets.TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "$CLIENT_SECRETS_DATA" > client_secrets.json
          echo "$TOKEN_JSON_DATA" > token.json
          python main.py

      - name: Auto Keep-Alive (Prevents 60-day cron suspension)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u)" > keepalive.txt
          git add keepalive.txt
          git commit -m "Automated keepalive ping [skip ci]" || exit 0
          git push
